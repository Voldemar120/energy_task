<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EnergyTask - Канбан доска</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <!-- Удаляем meta-теги CSRF, они не нужны при отключенном CSRF -->
</head>
<body class="bg-dark text-white">
<div class="board-container">
    <!-- Шапка -->
    <div class="d-flex justify-content-between align-items-center mb-4 text-white">
        <h1><i class="bi bi-kanban"></i> EnergyTask Board</h1>
        <div>
            <div class="btn-group me-2">
                <a th:href="@{/tasks}" class="btn btn-outline-light">
                    <i class="bi bi-table"></i> Таблица
                </a>
                <a th:href="@{/board}" class="btn btn-light">
                    <i class="bi bi-kanban"></i> Доска
                </a>
            </div>
            <a th:href="@{/tasks/new(redirect='board')}" class="btn btn-success me-2">
                <i class="bi bi-plus-circle"></i> Новая задача
            </a>
            <form th:action="@{/logout}" method="post">
                <button class="btn btn-outline-light" type="submit">
                    <i class="bi bi-box-arrow-right"></i> Выйти
                </button>
            </form>
        </div>
    </div>

    <!-- Канбан доска -->
    <div class="board-columns">
        <!-- Колонка "Нужно сделать" -->
        <div class="column column-todo" data-column="todo">
            <div class="column-header">
                <span><i class="bi bi-pencil-square"></i> Нужно сделать</span>
                <span class="badge bg-dark" th:text="${#lists.size(todoTasks)}">0</span>
            </div>
            <div class="column-body" id="todo-column">
                <div th:each="task : ${todoTasks}"
                     class="task-card"
                     th:classappend="${task.priority != null ? task.priority.toLowerCase() : 'medium'}"
                     draggable="true"
                     th:attr="data-id=${task.id}"
                     data-bs-toggle="modal"
                     data-bs-target="#editTaskModal"
                     onclick="loadTaskToModal(this)">

                    <div class="task-header">
                        <h6 class="task-title" th:text="${task.title}">Задача</h6>
                        <span class="priority-badge"
                              th:classappend="'priority-' + ${task.priority != null ? task.priority.toLowerCase() : 'medium'}"
                              th:text="${task.priority != null ? task.priority : 'MEDIUM'}">MEDIUM</span>
                    </div>
                    <div class="task-preview small text-muted d-flex justify-content-between align-items-center">
                        <span th:if="${task.dueDate != null}">
                            <i class="bi bi-calendar"></i> <span th:text="${task.formattedDueDate}"></span>
                        </span>
                        <span th:if="${task.getFirstImageUrl() != null}" class="badge bg-secondary">
                            <i class="bi bi-images"></i>
                        </span>
                    </div>
                </div>
            </div>
            <div class="column-footer">
                <a th:href="@{/tasks/new(redirect='board')}" class="btn btn-outline-light w-100">
                    <i class="bi bi-plus-circle"></i> Добавить карточку
                </a>
            </div>
        </div>

        <!-- Колонка "В процессе" -->
        <div class="column column-progress" data-column="inprogress">
            <div class="column-header">
                <span><i class="bi bi-arrow-repeat"></i> В процессе</span>
                <span class="badge bg-dark" th:text="${#lists.size(inProgressTasks)}">0</span>
            </div>
            <div class="column-body" id="inprogress-column">
                <div th:each="task : ${inProgressTasks}"
                     class="task-card"
                     th:classappend="${task.priority != null ? task.priority.toLowerCase() : 'medium'}"
                     draggable="true"
                     th:attr="data-id=${task.id}"
                     data-bs-toggle="modal"
                     data-bs-target="#editTaskModal"
                     onclick="loadTaskToModal(this)">

                    <div class="task-header">
                        <h6 class="task-title" th:text="${task.title}">Задача</h6>
                        <span class="priority-badge"
                              th:classappend="'priority-' + ${task.priority != null ? task.priority.toLowerCase() : 'medium'}"
                              th:text="${task.priority != null ? task.priority : 'MEDIUM'}">MEDIUM</span>
                    </div>
                    <div class="task-preview small text-muted d-flex justify-content-between align-items-center">
                        <span th:if="${task.dueDate != null}">
                            <i class="bi bi-calendar"></i> <span th:text="${task.formattedDueDate}"></span>
                        </span>
                        <span th:if="${task.getFirstImageUrl() != null}" class="badge bg-secondary">
                            <i class="bi bi-images"></i>
                        </span>
                    </div>
                </div>
            </div>
            <div class="column-footer">
                <a th:href="@{/tasks/new(redirect='board')}" class="btn btn-outline-light w-100">
                    <i class="bi bi-plus-circle"></i> Добавить карточку
                </a>
            </div>
        </div>

        <!-- Колонка "Готово" -->
        <div class="column column-done" data-column="done">
            <div class="column-header">
                <span><i class="bi bi-check-circle-fill"></i> Готово</span>
                <span class="badge bg-dark" th:text="${#lists.size(doneTasks)}">0</span>
            </div>
            <div class="column-body" id="done-column">
                <div th:each="task : ${doneTasks}"
                     class="task-card"
                     th:classappend="${task.priority != null ? task.priority.toLowerCase() : 'medium'}"
                     draggable="true"
                     th:attr="data-id=${task.id}"
                     data-bs-toggle="modal"
                     data-bs-target="#editTaskModal"
                     onclick="loadTaskToModal(this)">

                    <div class="task-header">
                        <h6 class="task-title" th:text="${task.title}">Задача</h6>
                        <span class="priority-badge"
                              th:classappend="'priority-' + ${task.priority != null ? task.priority.toLowerCase() : 'medium'}"
                              th:text="${task.priority != null ? task.priority : 'MEDIUM'}">MEDIUM</span>
                    </div>
                    <div class="task-preview small text-muted d-flex justify-content-between align-items-center">
                        <span th:if="${task.dueDate != null}">
                            <i class="bi bi-calendar"></i> <span th:text="${task.formattedDueDate}"></span>
                        </span>
                        <span th:if="${task.getFirstImageUrl() != null}" class="badge bg-secondary">
                            <i class="bi bi-images"></i>
                        </span>
                    </div>
                </div>
            </div>
            <div class="column-footer">
                <a th:href="@{/archive}" class="btn btn-outline-light w-100">
                    <i class="bi bi-archive"></i> Архив
                </a>
            </div>
        </div>
    </div>
</div>

<!-- Модальное окно для редактирования задачи -->
<div class="modal fade" id="editTaskModal" tabindex="-1" aria-labelledby="editTaskModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content bg-dark text-white">
            <div class="modal-header">
                <h5 class="modal-title" id="editTaskModalLabel">Редактирование задачи</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="editTaskForm" th:action="@{/tasks/save}" method="post">
                    <!-- Убираем CSRF поле -->
                    <input type="hidden" name="redirect" value="board"/>
                    <input type="hidden" id="taskId" name="id"/>
                    <input type="hidden" id="taskAttachments" name="attachmentsJson" value=""/>

                    <div class="mb-3">
                        <label for="taskTitle" class="form-label">Название</label>
                        <input type="text" class="form-control bg-dark text-white" id="taskTitle" name="title" required>
                    </div>

                    <div class="mb-3">
                        <label for="taskDescription" class="form-label">Описание</label>
                        <textarea class="form-control bg-dark text-white" id="taskDescription" name="description" rows="3"></textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="taskPriority" class="form-label">Приоритет</label>
                            <select class="form-select bg-dark text-white" id="taskPriority" name="priority">
                                <option value="LOW">🟢 Низкий</option>
                                <option value="MEDIUM">🟡 Средний</option>
                                <option value="HIGH">🔴 Высокий</option>
                            </select>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="taskColumn" class="form-label">Колонка</label>
                            <select class="form-select bg-dark text-white" id="taskColumn" name="columnType">
                                <option value="todo">📝 Нужно сделать</option>
                                <option value="inprogress">⚡ В процессе</option>
                                <option value="done">✅ Готово</option>
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="taskDueDate" class="form-label">Срок выполнения</label>
                            <input type="datetime-local" class="form-control bg-dark text-white" id="taskDueDate" name="dueDate">
                        </div>

                        <div class="col-md-6 mb-3">
                            <div class="form-check mt-4">
                                <input type="checkbox" class="form-check-input" id="taskCompleted" name="completed">
                                <label class="form-check-label" for="taskCompleted">Завершено</label>
                            </div>
                        </div>
                    </div>
                    <div class="row mt-3">
                        <div class="col-12">
                            <label class="form-label">Изображения</label>
                            <div id="imagePreviewArea" class="d-flex flex-wrap gap-2 mb-2">
                                <!-- Сюда будут динамически добавляться превью уже загруженных картинок -->
                            </div>
                            <div class="input-group">
                                <input type="file" id="imageUploadInput" class="form-control bg-dark text-white" accept="image/*">
                                <button class="btn btn-outline-primary" type="button" id="uploadImageBtn">
                                    <i class="bi bi-upload"></i> Загрузить
                                </button>
                            </div>
                            <small class="text-muted">Максимальный размер файла: 5 МБ. Поддерживаются JPG, PNG, GIF.</small>
                            <div id="uploadProgress" class="progress mt-2 d-none">
                                <div class="progress-bar progress-bar-striped progress-bar-animated" style="width: 0%"></div>
                            </div>

                        </div>
                    </div>
                    <div class="row mt-3">
                        <div class="col-12 d-flex justify-content-end gap-2">
                            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Отмена</button>
                            <button type="submit" class="btn btn-success">
                                <i class="bi bi-save"></i> Сохранить изменения
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>

    // Функция обновления счетчиков
    function updateCounters() {
        document.querySelectorAll('.column').forEach(column => {
            const count = column.querySelectorAll('.task-card').length;
            const badge = column.querySelector('.badge');
            if (badge) {
                badge.textContent = count;
            }
        });
    }

    document.addEventListener('DOMContentLoaded', function() {
        console.log('Drag & Drop инициализирован');

        const cards = document.querySelectorAll('.task-card');
        const columns = document.querySelectorAll('.column-body');

        // Настраиваем карточки
        cards.forEach(card => {
            card.setAttribute('draggable', 'true');

            card.addEventListener('dragstart', function(e) {
                this.classList.add('dragging');
                e.dataTransfer.setData('text/plain', this.getAttribute('data-id'));
            });

            card.addEventListener('dragend', function(e) {
                this.classList.remove('dragging');
            });
        });

        // Настраиваем колонки
        columns.forEach(column => {
            column.addEventListener('dragover', function(e) {
                e.preventDefault();
                this.classList.add('drag-over');
            });

            column.addEventListener('dragleave', function() {
                this.classList.remove('drag-over');
            });

            column.addEventListener('drop', function(e) {
                e.preventDefault();
                this.classList.remove('drag-over');

                const taskId = e.dataTransfer.getData('text/plain');
                const draggedCard = document.querySelector(`[data-id="${taskId}"]`);
                if (!draggedCard) return;

                const oldColumn = draggedCard.closest('.column').getAttribute('data-column');
                this.appendChild(draggedCard);

                const newColumn = this.closest('.column').getAttribute('data-column');
                const position = this.children.length - 1;

                console.log('Перемещение задачи', taskId, 'из', oldColumn, 'в', newColumn);

                fetch('/board/update-column', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        taskId: taskId,
                        column: newColumn,
                        position: position
                    })
                })
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('Ошибка сервера: ' + response.status);
                        }
                        return response.json();
                    })
                    .then(data => {
                        if (data.success) {
                            console.log('Задача успешно перемещена');
                            updateCounters();
                        } else {
                            console.error('Ошибка:', data.message);
                        }
                    })
                    .catch(error => {
                        console.error('Ошибка сети:', error);
                    });
            });
        });

        // Настраиваем загрузку изображений
        const uploadBtn = document.getElementById('uploadImageBtn');
        if (uploadBtn) {
            uploadBtn.addEventListener('click', function() {
                const fileInput = document.getElementById('imageUploadInput');
                const file = fileInput.files[0];
                const taskId = document.getElementById('taskId').value;

                if (!taskId || taskId === 'undefined') {
                    alert('Сначала сохраните задачу, чтобы получить её ID');
                    return;
                }

                if (!file) {
                    alert('Выберите файл для загрузки');
                    return;
                }

                if (file.size > 5 * 1024 * 1024) {
                    alert('Файл слишком большой. Максимальный размер 5 МБ.');
                    return;
                }

                const formData = new FormData();
                formData.append('file', file);

                const progressBar = document.querySelector('#uploadProgress');
                progressBar.classList.remove('d-none');

                fetch('/api/uploads', {
                    method: 'POST',
                    body: formData
                })
                    .then(response => {
                        if (!response.ok) {
                            return response.json().then(err => {
                                throw new Error(err.error || 'Ошибка загрузки: ' + response.status);
                            });
                        }
                        return response.json();
                    })
                    .then(data => {
                        console.log('Файл загружен:', data);

                        const attachmentsField = document.getElementById('taskAttachments');
                        let attachments = [];
                        if (attachmentsField.value) {
                            try {
                                attachments = JSON.parse(attachmentsField.value);
                            } catch (e) {
                                console.error('Ошибка парсинга JSON:', e);
                            }
                        }
                        attachments.push(data.url);
                        attachmentsField.value = JSON.stringify(attachments);

                        addImagePreview(data.url);

                        fileInput.value = '';
                        progressBar.classList.add('d-none');
                    })
                    .catch(error => {
                        console.error('Ошибка:', error);
                        alert('Ошибка при загрузке файла: ' + error.message);
                        progressBar.classList.add('d-none');
                    });
            });
        }
    });

    // Функция для добавления превью изображения
    function addImagePreview(imageUrl) {
        const previewArea = document.getElementById('imagePreviewArea');
        const previewDiv = document.createElement('div');
        previewDiv.className = 'position-relative';
        previewDiv.style.width = '80px';
        previewDiv.style.height = '80px';
        previewDiv.innerHTML = `
            <img src="${imageUrl}" class="img-thumbnail bg-dark" style="width: 100%; height: 100%; object-fit: cover;">
            <button type="button" class="btn btn-sm btn-danger position-absolute top-0 end-0" style="border-radius: 50%; padding: 0 5px;" onclick="this.parentElement.remove()">&times;</button>
        `;
        previewArea.appendChild(previewDiv);
    }

    // Функция загрузки данных задачи в модальное окно
    function loadTaskToModal(card) {
        const taskId = card.getAttribute('data-id');
        console.log('=== ЗАГРУЗКА ЗАДАЧИ С ID:', taskId, '===');

        if (!taskId || taskId === 'undefined') {
            console.error('ID задачи не определен');
            alert('Ошибка: ID задачи не определен');
            return;
        }

        const url = `/tasks/task/${taskId}`;
        console.log('URL запроса:', url);

        fetch(url)
            .then(response => {
                if (!response.ok) {
                    throw new Error('Ошибка загрузки: ' + response.status);
                }
                return response.json();
            })
            .then(task => {
                console.log('Данные задачи получены:', task);

                document.getElementById('taskId').value = task.id;
                document.getElementById('taskTitle').value = task.title || '';
                document.getElementById('taskDescription').value = task.description || '';
                document.getElementById('taskPriority').value = task.priority || 'MEDIUM';
                document.getElementById('taskColumn').value = task.columnType || 'todo';
                document.getElementById('taskCompleted').checked = task.completed || false;

                if (task.dueDate) {
                    document.getElementById('taskDueDate').value = task.dueDate;
                } else {
                    document.getElementById('taskDueDate').value = '';
                }

                const previewArea = document.getElementById('imagePreviewArea');
                previewArea.innerHTML = '';

                if (task.attachments && task.attachments.length > 0) {
                    const urls = [];
                    task.attachments.forEach(att => {
                        addImagePreview(att.url);
                        urls.push(att.url);
                    });
                    document.getElementById('taskAttachments').value = JSON.stringify(urls);
                } else {
                    document.getElementById('taskAttachments').value = '';
                }
            })
            .catch(error => {
                console.error('Ошибка загрузки задачи:', error);
                alert('Не удалось загрузить данные задачи: ' + error.message);
            });
    }

    // Отправка формы
    document.addEventListener('submit', function() {
        if (e.target.id === 'editTaskForm') {
            e.preventDefault();
            console.log('=== ОТПРАВКА ФОРМЫ ===');

            const taskId = document.getElementById('taskId').value;
            if (!taskId || taskId === 'undefined') {
                console.error('ID задачи не определен');
                alert('Ошибка: ID задачи не определен');
                return;
            }

            const form = e.target;
            const formData = new FormData(form);

            const attachmentsField = document.getElementById('taskAttachments');
            if (attachmentsField && attachmentsField.value) {
                try {
                    JSON.parse(attachmentsField.value);
                    // Теперь поле уже называется attachmentsJson
                    formData.append('attachmentsJson', attachmentsField.value);
                    console.log('Attachments JSON:', attachmentsField.value);
                } catch (e) {
                    console.error('Невалидный JSON в attachments:', e);
                }
            }

            fetch(form.action, {
                method: 'POST',
                body: new URLSearchParams(formData),
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                }
            })
                .then(response => {
                    console.log('Статус ответа:', response.status);
                    if (response.redirected) {
                        window.location.href = response.url;
                    } else if (response.ok) {
                        const modal = bootstrap.Modal.getInstance(document.getElementById('editTaskModal'));
                        if (modal) {
                            modal.hide();
                        }
                        location.reload();
                    } else {
                        response.text().then(text => {
                            console.error('Ошибка сервера:', text);
                            alert('Ошибка при сохранении задачи');
                        });
                    }
                })
                .catch(error => {
                    console.error('Ошибка:', error);
                    alert('Ошибка сети при сохранении задачи');
                });
        }
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
