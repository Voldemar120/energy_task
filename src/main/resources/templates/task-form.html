<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EnergyTask - Редактирование задачи</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-dark text-white">
<section>
    <div class="container">
        <!-- Навигация -->
        <div class="d-flex justify-content-between align-items-center mt-3 mb-4">
            <h2 th:text="${task.id == null} ? 'Создать задачу' : 'Редактировать задачу'"></h2>
            <div class="btn-group">
                <a th:href="@{/tasks}" class="btn btn-outline-light">
                    <i class="bi bi-table"></i> Таблица
                </a>
                <a th:href="@{/board}" class="btn btn-outline-light">
                    <i class="bi bi-kanban"></i> Доска
                </a>
            </div>
        </div>

        <form th:action="@{/tasks/save}" class="mb-3" th:object="${task}" method="post">
            <input type="hidden" th:field="*{id}"/>
            <!-- Добавляем скрытое поле для редиректа -->
            <input type="hidden" name="redirect" th:value="${param.redirect != null ? param.redirect : 'tasks'}"/>

            <div class="mb-3">
                <label for="title" class="form-label">Название</label>
                <input type="text" th:field="*{title}" id="title" class="form-control bg-dark text-white" required>
            </div>

            <div class="mb-3">
                <label for="description" class="form-label">Описание</label>
                <textarea id="description" th:field="*{description}" class="form-control bg-dark text-white" rows="3"></textarea>
            </div>

            <!-- Новые поля -->
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Колонка</label>
                    <select th:field="*{columnType}" class="form-select bg-dark text-white">
                        <option value="todo">📝 Нужно сделать</option>
                        <option value="inprogress">⚡ В процессе</option>
                        <option value="done">✅ Готово</option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Приоритет</label>
                    <select th:field="*{priority}" class="form-select bg-dark text-white">
                        <option value="LOW">🟢 Низкий</option>
                        <option value="MEDIUM">🟡 Средний</option>
                        <option value="HIGH">🔴 Высокий</option>
                    </select>
                </div>
            </div>

            <div class="mb-3">
                <label for="dueDate" class="form-label">Срок выполнения</label>
                <input type="datetime-local" th:field="*{dueDate}" class="form-control bg-dark text-white" id="dueDate">
            </div>

            <div class="mb-3">
                <div class="form-check">
                    <input type="checkbox" th:field="*{completed}" class="form-check-input" id="completed"/>
                    <label for="completed" class="form-check-label text-white">Завершено</label>
                </div>
            </div>

            <button type="submit" class="btn btn-success">
                <i class="bi bi-save"></i> Сохранить
            </button>


            <!-- Замените кнопку "Отмена" -->
            <a th:href="@{${redirect != null ? (redirect == 'board' ? '/board' : '/tasks') : '/tasks'}}"
               class="btn btn-outline-secondary">
                <i class="bi bi-x-circle"></i> Отмена
            </a>
        </form>
    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
