<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EnergyTask - Вход</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/style.css">

</head>

<body class="text-center bg-dark">
<main class="form-sigin">
    <div>
        <h2 class="h3 mb-3 fw-normal text-white">Login</h2>
        <form th:action="@{/login}" method="post">
            <div class="form-floating">
                <input type="text" id="username" class="form-control" name="username" placeholder="Username" required> <br>
                <label for="username">Username</label>
            </div>
            <div class="form-floating">
                <input id="password" class="form-control" type="password" name="password" placeholder="Password" required>
                <label for="password">Password</label>
            </div>
            <br>
            <button class="w-100 btn btn-lg btn-primary" type="submit">Login</button>
            <p>Don't Have an account? <a th:href="@{/register}">Register</a></p>
        </form>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
</body>
</html>
