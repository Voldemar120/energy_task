<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EnergyTask - Список задач</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-dark text-white">
<section>
    <div class="container">
        <!-- Улучшенная навигация -->
        <div class="d-flex justify-content-between align-items-center mt-3 mb-4">
            <h1><i class="bi bi-check2-square"></i> EnergyTask</h1>
            <div>
                <div class="btn-group me-2">
                    <a th:href="@{/tasks}" class="btn btn-light">
                        <i class="bi bi-table"></i> Таблица
                    </a>
                    <a th:href="@{/board}" class="btn btn-outline-light">
                        <i class="bi bi-kanban"></i> Доска
                    </a>
                </div>
                <a class="btn btn-success" th:href="@{/tasks/new}">
                    <i class="bi bi-plus-circle"></i> Добавить задачу
                </a>

            </div>
        </div>

        <!-- Таблица с задачами (обновленная) -->
        <table class="mt-3 table table-sm table-dark table-striped table-hover">
            <thead class="table-light">
            <tr>
                <th>#</th>
                <th>Статус</th>
                <th>Задача</th>
                <th>Примечание</th>
                <th>Приоритет</th>
                <th>Дата</th>
                <th>Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="task, iterStat : ${tasks}" th:class="${task.columnType == 'done'} ? 'table-secondary' : ''">
                <td th:text="${iterStat.count}"></td>
                <td class="text-center">
            <span th:if="${task.columnType == 'done'}" class="badge bg-success">
                <i class="bi bi-check-circle"></i> Выполнено
            </span>
                    <span th:if="${task.columnType == 'inprogress'}" class="badge bg-primary">
                <i class="bi bi-arrow-repeat"></i> В работе
            </span>
                    <span th:if="${task.columnType == 'todo' or task.columnType == null}" class="badge bg-warning text-dark">
                <i class="bi bi-clock"></i> Нужно сделать
            </span>
                </td>
                <td th:text="${task.title}"></td>
                <td th:text="${task.description}"></td>
                <td>
                    <span th:if="${task.priority == 'HIGH'}" class="badge bg-danger">Высокий</span>
                    <span th:if="${task.priority == 'MEDIUM'}" class="badge bg-warning text-dark">Средний</span>
                    <span th:if="${task.priority == 'LOW'}" class="badge bg-success">Низкий</span>
                    <span th:if="${task.priority == null}" class="badge bg-secondary">Не указан</span>
                </td>
                <td th:text="${task.formattedCreatedAt}"></td>
                <td class="action-cell">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/tasks/edit/{id}(id=${task.id})}" title="Редактировать">
                        <i class="bi bi-pencil"></i>
                    </a>
                    <a class="btn btn-sm btn-outline-warning" th:href="@{/tasks/toggle-status/{id}(id=${task.id})}"
                       th:title="${task.columnType == 'done'} ? 'Вернуть в работу' : 'Завершить'">
                        <i class="bi" th:class="${task.columnType == 'done'} ? 'bi-arrow-counterclockwise' : 'bi-check-circle'"></i>
                    </a>
                    <!-- Новая кнопка "В архив" -->
                    <a class="btn btn-sm btn-outline-secondary" th:href="@{/tasks/archive/{id}(id=${task.id})}"
                       title="В архив" onclick="return confirm('Отправить задачу в архив?')">
                        <i class="bi bi-archive"></i>
                    </a>
                    <a class="btn btn-sm btn-outline-danger" th:href="@{/tasks/delete/{id}(id=${task.id})}"
                       onclick="return confirm('Удалить задачу?')" title="Удалить">
                        <i class="bi bi-trash"></i>
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
        <!-- Кнопка выхода -->
        <div class="mt-3">
            <form th:action="@{/logout}" method="post" class="d-inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button class="btn btn-outline-danger" type="submit">
                    <i class="bi bi-box-arrow-right"></i> Выйти
                </button>
            </form>
        </div>

        <!-- Сообщение если задач нет -->
        <div class="alert alert-info text-center mt-3" th:if="${#lists.isEmpty(tasks)}">
            <i class="bi bi-inbox fs-1 d-block mb-3"></i>
            📭 У вас пока нет задач. <a th:href="@{/tasks/new}" class="alert-link">Создайте первую!</a>
        </div>
    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
